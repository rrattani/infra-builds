name: Build Kaptain Collection

on:
  schedule:
    - cron: '17 3 * * *' # Staggered cron schedule (runs daily at 03:17 UTC)
  workflow_dispatch:    # Manual trigger option

# Grant packages: write permission at the parent workflow level
permissions:
  packages: write
  contents: read

jobs:
  build:
    uses: ./.github/workflows/engine-build-and-push.yml
    with:
      upstream_repo: "ImKaptain/Kaptain-Collection"
      dockerfile_path: "dockerfiles/kaptain-collection.Dockerfile"
      image_name: "kaptain-collection"