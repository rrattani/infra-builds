name: Keepalive Workflow

on:
  schedule:
    - cron: "23 4 * * 3" # Runs every Wednesday at 04:23 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  keepalive-job:
    name: Keepalive All Workflows
    runs-on: ubuntu-latest
    steps:
      - name: Prevent Workflow Inactivity Disabling
        run: |
          echo "Pinging GitHub API to keep repository workflows active..."
          curl -s -X GET \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows" > /dev/null
