name: Keepalive Workflow

on:
  schedule:
    - cron: "23 4 * * 3" # Runs every Wednesday at 04:23 UTC

permissions:
  actions: write

jobs:
  keepalive-job:
    name: Keepalive All Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          time_elapsed: "0"