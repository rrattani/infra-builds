name: Generic Docker Multi-Arch Retag Utility

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'The package directory/repo name (e.g., kaptain-collection)'
        required: true
        type: string
      target_tag:
        description: 'The older version tag or SHA to promote to latest (e.g., 4c1ebb5bb4f0ffd06f72c79aa7d2644aa059e38f)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      # This step uses the GitHub registry API directly to duplicate the target manifest pointer.
      # It natively keeps your multi-arch architectures and exact SHA signatures completely intact.
      - name: Retag Multi-Arch Image via Registry API
        uses: shrink/actions-docker-registry-tag@v4
        with:
          registry: ${{ env.REGISTRY }}
          repository: ${{ github.repository_owner }}/${{ inputs.package_name }}
          target: ${{ inputs.target_tag }}
          tags: latest
