name: Generic Docker Multi-Arch Retag Utility

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'The package directory/repo name (e.g., my-awesome-app)'
        required: true
        type: string
      target_tag:
        description: 'The older version tag or SHA to promote to latest'
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      # 1. Install regctl utility to handle multi-arch manifests
      - name: Install regctl
        uses: regclient/actions/regctl-installer@v1

      # 2. Log in directly to GHCR using regctl
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | regctl registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --pass-stdin

      # 3. Construct the image path
      - name: Set Image Environment Variable
        run: echo "FULL_IMAGE_NAME=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ inputs.package_name }}" >> $GITHUB_ENV

      # 4. Copy the tag in the cloud (This preserves all architectures!)
      - name: Copy target tag to latest
        run: |
          regctl image copy ${{ env.FULL_IMAGE_NAME }}:${{ inputs.target_tag }} ${{ env.FULL_IMAGE_NAME }}:latest
